services:
  radar:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RADAR_DB: /data/radar.sqlite
      RADAR_HOST: 0.0.0.0
      RADAR_PORT: "8000"
      HF_HOME: /data/huggingface
      IG_SESSION_FILE: /data/ig.session
      RADAR_SOURCE: auto
      CODEX_HOME: /root/.codex
    volumes:
      - radar-data:/data
      - codex-auth:/root/.codex
    restart: unless-stopped

volumes:
  radar-data:
  codex-auth:
