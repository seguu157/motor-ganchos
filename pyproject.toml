[project]
name = "radar-ganchos"
version = "0.1.0"
description = "Motor de ganchos y formatos para reels de Instagram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
radar = ["templates/*.html", "static/*", "fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
